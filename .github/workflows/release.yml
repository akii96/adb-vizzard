name: Release

# Tag a commit to publish installers:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Stable tags must match the app version. Prerelease tags may add a suffix,
# e.g. app version 0.1.0 with tag v0.1.0-beta.2. MSI rejects textual
# prerelease identifiers, so the packaged app version must remain numeric.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Tauri bundles for the host OS only, so each platform needs its own runner.
  # The version check is split out so a mistyped tag fails in seconds rather
  # than after both builds have compiled.
  check:
    name: Check the tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with tauri.conf.json
        run: |
          ref="${{ github.ref_name }}"
          tagVersion="${ref#v}"
          tagVersion="${tagVersion%%-*}"
          appVersion=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$ref  numeric tag version=$tagVersion  tauri.conf.json=$appVersion"
          if [[ "$ref" == v* && "$tagVersion" != "$appVersion" ]]; then
            echo "::error::Tag $ref does not match version $appVersion in src-tauri/tauri.conf.json"
            exit 1
          fi

  windows:
    name: Build Windows installers
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test before shipping
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate icons
        run: npm run icons

      - name: Build installers
        run: npx tauri build

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          Copy-Item "$bundle/nsis/*.exe" artifacts/
          Copy-Item "$bundle/msi/*.msi" artifacts/

          # Portable build: the bare executable, for anyone who cannot or would
          # rather not run an installer. Needs the WebView2 runtime, which ships
          # with Windows 10/11.
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $portable = "ADB Vizzard_${version}_x64_portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "src-tauri/target/release/adb-vizzard.exe" $portable/
          Copy-Item README.md $portable/
          Compress-Archive -Path "$portable/*" -DestinationPath "artifacts/$portable.zip"

          Get-ChildItem artifacts | ForEach-Object {
            "{0,8:N2} MB  {1}" -f ($_.Length / 1MB), $_.Name
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/*

  macos:
    name: Build macOS disk image
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves are needed for a universal binary. The runner is Apple
          # Silicon, so a host-only build would produce a .dmg that refuses to
          # launch on Intel Macs.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test before shipping
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate icons
        # icons/icon.icns is committed because this is the only job that can
        # regenerate it: the generator shells out to sips and iconutil, both
        # macOS-only. Everywhere else the committed file is used as-is.
        run: npm run icons

      - name: Build the app bundle
        run: npx tauri build --target universal-apple-darwin

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/*

  publish:
    name: Publish release
    needs: [windows, macos]
    # The macOS bundle is new and unsigned. If it breaks, the Windows installers
    # people actually depend on should still ship, so this gates on the Windows
    # job alone and publishes whichever artifacts were produced.
    if: |
      always()
      && needs.windows.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            > **Beta release:** please report issues and unexpected behavior before wider deployment.

            ## Install

            Pick one:

            **Windows**

            - **`ADB Vizzard_*_x64-setup.exe`** — recommended. Installs for the current
              user under `%LOCALAPPDATA%` and needs **no administrator rights**.
            - **`ADB Vizzard_*_x64_en-US.msi`** — per-machine, for IT-managed rollout.
            - **`ADB Vizzard_*_x64_portable.zip`** — no install at all; unzip and run
              `adb-vizzard.exe`.

            **macOS**

            - **`ADB Vizzard_*_universal.dmg`** — one download for both Intel and Apple
              Silicon. Open it and drag the app to *Applications*.

              This build is **unsigned and not notarised**, so Gatekeeper blocks it the
              first time. Clearing the quarantine flag is the reliable fix:

              ```
              xattr -dr com.apple.quarantine "/Applications/ADB Vizzard.app"
              ```

              Alternatively, launch it once, then allow it under
              *System Settings → Privacy & Security → Open Anyway*.

            No Python, Node or Rust needed to run any of these. On Windows, WebView2
            ships with Windows 10/11 and the installers carry its bootstrapper as a
            fallback; on macOS the system WebKit is used.
